  <text x="170" y="154" fill="#DFF8FF" font-family="Segoe UI, Arial, sans-serif" font-size="56" font-weight="700" letter-spacing="0.8">Lankalapalli Guna Sai Charan Teja</text>
  <text x="170" y="201" fill="#88F1FF" font-family="Segoe UI, Arial, sans-serif" font-size="24" font-weight="600" letter-spacing="3">JAVA BACKEND ENGINEER</text>

  <text x="170" y="254" fill="#9FB5D9" font-family="Consolas, Menlo, monospace" font-size="18">Building secure, scalable, event-driven backend systems with Spring ecosystem.</text>
  <text x="170" y="287" fill="#9FB5D9" font-family="Consolas, Menlo, monospace" font-size="18">Focus: Microservices, Kafka, Redis idempotency, Spring AI MCP integration.</text>

  <g>
    <rect x="170" y="314" width="244" height="34" rx="17" fill="#0B162B" stroke="#1F3A66"/>
