<svg width="1280" height="420" viewBox="0 0 1280 420" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1280" y2="420" gradientUnits="userSpaceOnUse">
      <stop stop-color="#05070F"/>
      <stop offset="0.55" stop-color="#0A1020"/>
      <stop offset="1" stop-color="#05070F"/>
    </linearGradient>
    <radialGradient id="glow1" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(255 130) rotate(34) scale(360 210)">
      <stop stop-color="#00E5FF" stop-opacity="0.30"/>
      <stop offset="1" stop-color="#00E5FF" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glow2" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(980 320) rotate(160) scale(340 220)">
      <stop stop-color="#00FFA3" stop-opacity="0.18"/>
      <stop offset="1" stop-color="#00FFA3" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="line" x1="170" y1="0" x2="1110" y2="0" gradientUnits="userSpaceOnUse">
      <stop stop-color="#00E5FF" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#00E5FF" stop-opacity="0.8"/>
      <stop offset="1" stop-color="#00E5FF" stop-opacity="0"/>
    </linearGradient>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="18"/>
    </filter>
  </defs>

  <rect width="1280" height="420" rx="28" fill="url(#bg)"/>
  <rect x="1" y="1" width="1278" height="418" rx="27" stroke="#1A2742"/>

  <ellipse cx="255" cy="130" rx="360" ry="210" fill="url(#glow1)"/>
  <ellipse cx="980" cy="320" rx="340" ry="220" fill="url(#glow2)"/>

  <g opacity="0.45">
    <line x1="140" y1="104" x2="1140" y2="104" stroke="#1C2A49"/>
    <line x1="140" y1="160" x2="1140" y2="160" stroke="#1C2A49"/>
    <line x1="140" y1="216" x2="1140" y2="216" stroke="#1C2A49"/>
    <line x1="140" y1="272" x2="1140" y2="272" stroke="#1C2A49"/>
    <line x1="140" y1="328" x2="1140" y2="328" stroke="#1C2A49"/>
  </g>

  <rect x="170" y="74" width="940" height="2" fill="url(#line)"/>
  <rect x="170" y="346" width="940" height="2" fill="url(#line)"/>

  <g filter="url(#soft)">
    <circle cx="1115" cy="76" r="10" fill="#00E5FF"/>
    <circle cx="1090" cy="76" r="10" fill="#00FFA3"/>
